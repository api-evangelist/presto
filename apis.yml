aid: presto
name: Presto
description: >-
  Presto Charging (Presto) is an electric-vehicle charging platform that
  aggregates access to 180,000+ public chargers across 20+ North American
  networks — including EVgo, ChargePoint, Blink, BP Pulse, and Flo — behind a
  single mobile app, payment method, and account. For drivers it offers price
  comparison, real-time charger availability, and a unified charging experience
  on iOS and Android. For fleets and enterprises it delivers charge management,
  granular usage data, and white-label products so operators can "manage
  charging like they manage fuel." For charging networks it drives utilization
  and station profitability. Presto exposes OCPI-compliant, mobile-first APIs
  and SDKs so fleet-solution and mobility partners can embed public charging —
  including Plug and Charge and Autocharge — under their own brand. Backed by
  Union Square Ventures.
